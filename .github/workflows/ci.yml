name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Verify Bun pin parity
        working-directory: web
        shell: bash
        run: |
          expected="bun@$(bun --version)"
          actual="$(bun -p 'require("./package.json").packageManager')"
          if [[ "$actual" != "$expected" ]]; then
            echo "packageManager is $actual but CI installed $expected" >&2
            exit 1
          fi

      - name: Install dashboard dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint dashboard
        working-directory: web
        run: bun run lint

      - name: Build dashboard
        working-directory: web
        run: bun run build

      - name: Verify generated dashboard is current
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all -- web/dist)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            echo 'web/dist is not the exact output of the dashboard build' >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify Go package discovery
        shell: bash
        run: |
          if ! package_output="$(go list ./...)"; then
            echo 'go list failed during package discovery' >&2
            exit 1
          fi
          mapfile -t packages <<< "$package_output"
          printf '%s\n' "${packages[@]}"
          if printf '%s\n' "${packages[@]}" | grep -Fq '/node_modules/'; then
            echo 'go list unexpectedly discovered a package under node_modules' >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
